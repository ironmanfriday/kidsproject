const DEFAULT_DATA={
  kids:[{name:"Sriman",score:0,choreLog:{}},{name:"Sivansh",score:0,choreLog:{}}],
  chores:[...SHARED_CHORES,...SRIMAN_CHORES],
  penalties:[{id:100,name:"Not eating vegetables/fruits",points:10},{id:101,name:"Too much screen time",points:20}],
  nextId:300
};

let data=null,db=null,dbRef=null,activeTab="kid-0",familyCode=localStorage.getItem("choreTracker_familyCode")||"",firebaseReady=false,connected=false;
let selDates=[todayStr(),todayStr()];
let mcMonths=[curMonth(),curMonth()];
let ctKid=0,ctView="weekly",cwStart=getWS(todayStr()),cMonth=curMonth();

function todayStr(){return new Date().toISOString().slice(0,10)}
function curMonth(){const d=new Date();return{year:d.getFullYear(),month:d.getMonth()}}
function fmt(s){const d=new Date(s+"T12:00:00");return DS[d.getDay()]+", "+MS[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear()}
function fmtS(s){const d=new Date(s+"T12:00:00");return MS[d.getMonth()]+" "+d.getDate()}
function shD(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function getWS(s){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()-d.getDay());return d.toISOString().slice(0,10)}
function dStr(y,m,d){return`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`}

function choresForKid(ki){return(data.chores||[]).filter(c=>{const k=c.kidIds||[0,1];return k.includes(ki)})}

function getLog(ki,ds){const k=data.kids[ki];if(!k.choreLog)k.choreLog={};if(!k.choreLog[ds])k.choreLog[ds]={chores:[],penalties:[]};const l=k.choreLog[ds];if(!l.chores)l.chores=[];if(!l.penalties)l.penalties=[];return l}
function getDayPts(ki,ds){const k=data.kids[ki];if(!k.choreLog||!k.choreLog[ds])return{pts:0,done:0};const l=k.choreLog[ds];let pts=0,done=0;(l.chores||[]).forEach(cid=>{const c=(data.chores||[]).find(x=>x.id===cid);if(c){pts+=c.points;done++}});(l.penalties||[]).forEach(pid=>{const p=(data.penalties||[]).find(x=>x.id===pid);if(p)pts-=p.points});return{pts,done}}
function getDot(ki,ds){const k=data.kids[ki];if(!k.choreLog||!k.choreLog[ds])return"dn";const l=k.choreLog[ds];const done=(l.chores||[]).length;if(done===0&&(!l.penalties||!l.penalties.length))return"dn";const total=choresForKid(ki).length;return done>=total?"dg":"dy"}

function migrate(){
  if(!data||!data.kids)return;
  data.kids.forEach(k=>{
    if(k.toggledChores&&k.toggledChores.length>0){const dk=data.lastDate||todayStr();if(!k.choreLog)k.choreLog={};if(!k.choreLog[dk])k.choreLog[dk]={chores:[],penalties:[]};k.choreLog[dk].chores=k.toggledChores;if(k.toggledPenalties)k.choreLog[dk].penalties=k.toggledPenalties}
    delete k.toggledChores;delete k.toggledPenalties;if(!k.choreLog)k.choreLog={};
  });
  // Add kidIds to chores that don't have it
  (data.chores||[]).forEach(c=>{if(!c.kidIds)c.kidIds=[0,1]});
}

function initFB(){try{firebase.initializeApp(FBC);db=firebase.database();return true}catch(e){return false}}
function connectFamily(code){
  familyCode=code.trim().toLowerCase().replace(/[^a-z0-9_-]/g,"");if(!familyCode)return;
  localStorage.setItem("choreTracker_familyCode",familyCode);
  dbRef=db.ref("families/"+familyCode);
  db.ref(".info/connected").on("value",s=>{connected=s.val()===true;updBadge()});
  dbRef.on("value",s=>{
    const v=s.val();
    if(v){data=v;data.kids=data.kids||DEFAULT_DATA.kids;data.chores=data.chores||DEFAULT_DATA.chores;data.penalties=data.penalties||[];
      data.kids.forEach(k=>{if(!k.choreLog)k.choreLog={}});migrate();
    }else{data=JSON.parse(JSON.stringify(DEFAULT_DATA));save()}
    render();
  });
}
function save(){if(dbRef&&data){data.kids.forEach(k=>{if(!k.choreLog)k.choreLog={}});dbRef.set(data).catch(e=>console.error(e))}}
function updBadge(){const b=document.getElementById("syncBadge");if(!firebaseReady||!familyCode){b.textContent="OFFLINE";b.className="sb off";return}b.textContent=connected?"SYNCED":"OFFLINE";b.className="sb "+(connected?"on":"off")}

function renderSetup(){
  document.getElementById("tabs").innerHTML="";const p=document.getElementById("pages");
  if(FBC.apiKey==="PASTE_YOUR_API_KEY_HERE"){p.innerHTML=`<div class="sus"><h2>🔧 Firebase Not Configured</h2><p>Open this file and paste your Firebase config.</p></div>`;return}
  firebaseReady=initFB();if(!firebaseReady){p.innerHTML=`<div class="sus"><h2>❌ Error</h2></div>`;return}
  if(familyCode){connectFamily(familyCode);return}
  p.innerHTML=`<div class="sus"><h2>👨‍👩‍👧‍👦 Family Setup</h2><p>Enter a family code to sync across devices.</p><div class="fld"><label>Family Code</label><input id="codeIn" placeholder="e.g. smith-family" autocapitalize="off"></div><button class="btn bp" onclick="doJoin()">🚀 Start Tracking</button></div>`;
  document.getElementById("codeIn").addEventListener("keydown",e=>{if(e.key==="Enter")doJoin()});updBadge();
}
function doJoin(){const c=document.getElementById("codeIn").value.trim();if(!c){alert("Enter a code!");return}connectFamily(c)}

/* ══════ RENDER ══════ */
function render(){if(!data)return;renderTabs();renderPages();updBadge()}
function renderTabs(){
  const t=document.getElementById("tabs");let h="";
  data.kids.forEach((k,i)=>{h+=`<button class="tab ${activeTab==="kid-"+i?"active":""}" onclick="sTab('kid-${i}')">${esc(k.name)}</button>`});
  h+=`<button class="tab ${activeTab==="calendar"?"active":""}" onclick="sTab('calendar')">📅</button>`;
  h+=`<button class="tab ${activeTab==="settings"?"active":""}" onclick="sTab('settings')">⚙️</button>`;
  h+=`<button class="tab ${activeTab==="prompt"?"active":""}" onclick="sTab('prompt')">📋</button>`;
  t.innerHTML=h;
}

function renderPages(){
  const p=document.getElementById("pages");let h="";
  data.kids.forEach((k,i)=>{
    const cls=i===1?"k2":"",ds=selDates[i],isT=ds===todayStr(),log=getLog(i,ds);
    const dp=getDayPts(i,ds),kChores=choresForKid(i);
    h+=`<div class="page ${cls} ${activeTab==="kid-"+i?"active":""}">`;
    h+=`<div class="pb" style="${i===1?"--kid1:var(--kid2)":""}"><div class="lb">${esc(k.name)}'s Total Points</div><div class="sc">${k.score}</div></div>`;
    h+=`<div class="dp"><button class="ar" onclick="chgD(${i},-1)">‹</button><div class="di"><div class="dl">${isT?"Today":"Viewing"}</div><div class="dv ${isT?"ist":""}" onclick="opP(${i})">${fmt(ds)}</div><input type="date" class="hdi" id="dp-${i}" value="${ds}" max="${todayStr()}" onchange="pkD(${i},this.value)"></div><button class="tb ${isT?"hid":""}" onclick="goT(${i})">Today</button><button class="ar" onclick="chgD(${i},1)" ${isT?"disabled style='opacity:.3'":""}>›</button></div>`;
    h+=`<div class="ds"><div class="st"><div class="sv">${dp.done}/${kChores.length}</div><div class="sl">Done</div></div><div class="st"><div class="sv">${dp.pts>=0?"+":""}${dp.pts}</div><div class="sl">Day Pts</div></div></div>`;
    h+=`<div class="adj"><input type="number" id="adj-${i}" placeholder="±pts" inputmode="numeric"><button onclick="apAdj(${i})">Apply</button></div>`;
    h+=`<div class="st2">Chores</div>`;
    kChores.forEach((c,ci)=>{const on=(log.chores||[]).includes(c.id);h+=`<div class="cc ${on?"on":""} c${ci%8}" onclick="tgC(${i},'${ds}',${c.id})"><div class="em">${CE[ci%CE.length]}</div><div class="inf"><div class="nm">${esc(c.name)}</div><div class="pt">+${c.points} pts</div></div><div class="tg"></div></div>`});
    if(data.penalties&&data.penalties.length){
      h+=`<div class="st2">Penalties</div>`;
      data.penalties.forEach((pen,pi)=>{const on=(log.penalties||[]).includes(pen.id);h+=`<div class="cc pc ${on?"on":""}" onclick="tgP(${i},'${ds}',${pen.id})"><div class="em">${PE[pi%PE.length]}</div><div class="inf"><div class="nm">${esc(pen.name)}</div><div class="pt">−${pen.points} pts</div></div><div class="tg"></div></div>`});
    }
    h+=renderMiniCal(i);
    h+=`<div style="margin-top:14px"><button class="btn bo" onclick="cfmRD(${i},'${ds}')">🔄 Reset ${isT?"Today's":"This Day's"} Switches</button></div></div>`;
  });
  h+=`<div class="page ${activeTab==="calendar"?"active":""}">${renderCalTab()}</div>`;
  h+=`<div class="page ${activeTab==="settings"?"active":""}">${renderSettings()}</div>`;
  h+=`<div class="page ${activeTab==="prompt"?"active":""}">${renderPrompt()}</div>`;
  p.innerHTML=h;
}

function renderMiniCal(ki){
  const mc=mcMonths[ki],y=mc.year,m=mc.month,fd=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  let h=`<div class="mc"><div class="mch"><button class="ma" onclick="shMC(${ki},-1)">‹</button><div class="mt">${MO[m]} ${y}</div><button class="ma" onclick="shMC(${ki},1)">›</button></div><div class="mg">`;
  DS.forEach(d=>{h+=`<div class="mdow">${d.charAt(0)}</div>`});
  for(let i=0;i<fd;i++)h+=`<div class="md emp"></div>`;
  for(let d=1;d<=dim;d++){const ds=dStr(y,m,d),iF=ds>todayStr(),iT=ds===todayStr(),iS=ds===selDates[ki],dt=iF?"dn":getDot(ki,ds);
    h+=`<div class="md${iF?" fut":""}${iT?" tod":""}${iS?" sel":""}" onclick="mcClick(${ki},'${ds}')">${d}<span class="dot ${dt}"></span></div>`}
  h+=`</div><div class="lg"><span><span class="ld" style="background:var(--green)"></span>All</span><span><span class="ld" style="background:var(--orange)"></span>Partial</span></div></div>`;
  return h;
}

function renderCalTab(){
  let h=`<div class="ckt">`;
  data.kids.forEach((k,i)=>{h+=`<button class="ckb ${i===ctKid?"a"+i:""}" onclick="ctKid=${i};render()">${esc(k.name)}</button>`});
  h+=`</div><div class="cvt"><button class="cvb ${ctView==="weekly"?"act":""}" onclick="ctView='weekly';render()">📊 Weekly</button><button class="cvb ${ctView==="monthly"?"act":""}" onclick="ctView='monthly';render()">📅 Monthly</button></div>`;
  return h+(ctView==="weekly"?renderWeek(ctKid):renderMonthFull(ctKid));
}

function renderWeek(ki){
  const ws=cwStart,days=[];for(let i=0;i<7;i++)days.push(shD(ws,i));
  const kChores=choresForKid(ki);
  let h=`<div class="wn"><button class="wa" onclick="shW(-1)">‹</button><div class="wt">${fmtS(ws)} — ${fmtS(days[6])}</div><button class="wa" onclick="shW(1)">›</button></div>`;
  h+=`<div class="wg"><div class="whr"><div class="wlc">Chore</div>`;
  days.forEach(d=>{const iT=d===todayStr();h+=`<div class="whc${iT?" tc":""}">${DS[new Date(d+"T12:00:00").getDay()]}<br>${new Date(d+"T12:00:00").getDate()}</div>`});
  h+=`</div>`;
  kChores.forEach(c=>{
    h+=`<div class="wr"><div class="wcn">${esc(c.name)}</div>`;
    days.forEach(d=>{const iT=d===todayStr(),iF=d>todayStr(),log=data.kids[ki].choreLog&&data.kids[ki].choreLog[d],done=log&&log.chores&&log.chores.includes(c.id);
      h+=`<div class="wc${iT?" tc":""}">${iF?"":done?"✅":"—"}</div>`});
    h+=`</div>`;
  });
  h+=`<div class="wtr"><div class="wcn">Day Pts</div>`;
  days.forEach(d=>{const iT=d===todayStr(),iF=d>todayStr(),dp=getDayPts(ki,d);h+=`<div class="wc${iT?" tc":""}">${iF?"":dp.pts}</div>`});
  h+=`</div></div>`;
  if(data.penalties&&data.penalties.length){
    h+=`<div class="st2" style="margin-top:10px">Penalties</div><div class="wg"><div class="whr"><div class="wlc">Penalty</div>`;
    days.forEach(d=>{const iT=d===todayStr();h+=`<div class="whc${iT?" tc":""}">${DS[new Date(d+"T12:00:00").getDay()]}</div>`});h+=`</div>`;
    data.penalties.forEach(pen=>{h+=`<div class="wr"><div class="wcn">${esc(pen.name)}</div>`;days.forEach(d=>{const iT=d===todayStr(),iF=d>todayStr(),log=data.kids[ki].choreLog&&data.kids[ki].choreLog[d],on=log&&log.penalties&&log.penalties.includes(pen.id);h+=`<div class="wc${iT?" tc":""}">${iF?"":on?"🔴":"—"}</div>`});h+=`</div>`});
    h+=`</div>`;
  }
  return h;
}

function renderMonthFull(ki){
  const y=cMonth.year,m=cMonth.month,fd=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  let h=`<div class="mf"><div class="mfh"><button class="mfa" onclick="shCM(-1)">‹</button><div class="mft">${MO[m]} ${y}</div><button class="mfa" onclick="shCM(1)">›</button></div><div class="mfg">`;
  DS.forEach(d=>{h+=`<div class="mfdow">${d}</div>`});
  for(let i=0;i<fd;i++)h+=`<div class="mfd emp"></div>`;
  for(let d=1;d<=dim;d++){const ds=dStr(y,m,d),iF=ds>todayStr(),iT=ds===todayStr(),dp=getDayPts(ki,ds),dt=iF?"":getDot(ki,ds);
    h+=`<div class="mfd${iF?" fut":""}${iT?" tod":""}" onclick="showDP(${ki},'${ds}')"><div class="mn">${d}</div>`;
    if(!iF&&dp.pts!==0)h+=`<div class="mp">${dp.pts>0?"+":""}${dp.pts}</div>`;
    if(!iF&&dt&&dt!=="dn")h+=`<span class="mdot ${dt}"></span>`;h+=`</div>`}
  h+=`</div><div class="lg" style="margin-top:10px"><span><span class="ld" style="background:var(--green)"></span>All</span><span><span class="ld" style="background:var(--orange)"></span>Partial</span></div>`;
  let tp=0,td2=0,ad=0;for(let d=1;d<=dim;d++){const ds=dStr(y,m,d);if(ds>todayStr())break;const dp=getDayPts(ki,ds);tp+=dp.pts;td2+=dp.done;if(dp.done>0)ad++}
  h+=`<div class="dsr" style="margin-top:12px"><div class="dss"><div class="dsv">${tp}</div><div class="dsl">Month Pts</div></div><div class="dss"><div class="dsv">${ad}</div><div class="dsl">Active Days</div></div><div class="dss"><div class="dsv">${td2}</div><div class="dsl">Chores Done</div></div></div></div>`;
  return h;
}

function showDP(ki,ds){
  if(ds>todayStr())return;
  const k=data.kids[ki],dp=getDayPts(ki,ds),log=getLog(ki,ds),kChores=choresForKid(ki);
  let h=`<h3>${esc(k.name)}</h3><div class="dd">${fmt(ds)}</div>`;
  h+=`<div class="dsr"><div class="dss"><div class="dsv">${dp.done}/${kChores.length}</div><div class="dsl">Done</div></div><div class="dss"><div class="dsv">${dp.pts>=0?"+":""}${dp.pts}</div><div class="dsl">Points</div></div></div>`;
  h+=`<div class="dps"><h4>✅ Completed</h4>`;
  const doneC=(log.chores||[]).map(cid=>(data.chores||[]).find(x=>x.id===cid)).filter(Boolean);
  if(doneC.length)doneC.forEach(c=>{h+=`<div class="dpi"><span style="color:var(--green)">✓</span> ${esc(c.name)}<span class="dppt" style="color:var(--green)">+${c.points}</span></div>`});
  else h+=`<div class="dpe">No chores completed</div>`;h+=`</div>`;
  const doneP=(log.penalties||[]).map(pid=>(data.penalties||[]).find(x=>x.id===pid)).filter(Boolean);
  if(doneP.length){h+=`<div class="dps"><h4>⚠️ Penalties</h4>`;doneP.forEach(p2=>{h+=`<div class="dpi"><span style="color:var(--red)">✗</span> ${esc(p2.name)}<span class="dppt" style="color:var(--red)">−${p2.points}</span></div>`});h+=`</div>`}
  const undone=kChores.filter(c=>!(log.chores||[]).includes(c.id));
  if(undone.length){h+=`<div class="dps"><h4>⬜ Not Done</h4>`;undone.forEach(c=>{h+=`<div class="dpi" style="opacity:.45">○ ${esc(c.name)}<span class="dppt">+${c.points}</span></div>`});h+=`</div>`}
  h+=`<button class="dpgo" onclick="gotoDP(${ki},'${ds}')">📝 Edit This Day</button><button class="dpcl" onclick="closeDP()">Close</button>`;
  document.getElementById("dpCon").innerHTML=h;document.getElementById("dayPopup").classList.add("show");
}
function closeDP(){document.getElementById("dayPopup").classList.remove("show")}
function gotoDP(ki,ds){closeDP();selDates[ki]=ds;activeTab="kid-"+ki;render();document.getElementById("pages").scrollTop=0}

function renderSettings(){
  let h=`<div class="ss"><h3>👧 Kid Names</h3>`;
  data.kids.forEach((k,i)=>{h+=`<div class="si"><input value="${escA(k.name)}" onchange="rnKid(${i},this.value)"></div>`});h+=`</div>`;
  // Per-kid chore sections
  data.kids.forEach((k,ki)=>{
    const kidChores=choresForKid(ki);
    const clr=ki===0?"var(--purple)":"var(--pink)";
    const otherKi=ki===0?1:0;
    const otherName=data.kids[otherKi]?data.kids[otherKi].name:"Kid "+(otherKi+1);
    h+=`<div class="ss"><h3 style="color:${clr}">✅ ${esc(k.name)}'s Chores (${kidChores.length})</h3>`;
    kidChores.forEach(c=>{
      const shared=(c.kidIds||[0,1]).includes(otherKi);
      const badge=shared?`<span style="font-size:9px;padding:2px 6px;border-radius:6px;background:${ki===0?"var(--pink)":"var(--purple)"};color:#fff;font-weight:800;flex-shrink:0">+${esc(otherName.charAt(0))}</span>`:"";
      h+=`<div class="si"><input value="${escA(c.name)}" onchange="eCN(${c.id},this.value)"><input type="number" value="${c.points}" min="0" onchange="eCP(${c.id},this.value)" inputmode="numeric">${badge}<button class="db" onclick="rmFromKid(${c.id},${ki})" title="Remove from ${esc(k.name)}">×</button></div>`;
    });
    h+=`<div class="ar2"><input id="ncn-${ki}" placeholder="Add chore for ${esc(k.name)}"><input id="ncp-${ki}" type="number" value="5" min="0" inputmode="numeric"><button onclick="aCK(${ki})">+ Add</button></div>`;
    // Assign existing chore from other kid
    const otherOnly=(data.chores||[]).filter(c=>{const ids=c.kidIds||[0,1];return ids.includes(otherKi)&&!ids.includes(ki)});
    if(otherOnly.length){h+=`<div style="margin-top:8px"><select id="aex-${ki}" style="width:100%;padding:8px;border-radius:9px;border:2px solid #E0DAF0;font-size:12px;font-weight:700;font-family:inherit"><option value="">＋ Also assign from ${esc(otherName)}'s list...</option>`;
      otherOnly.forEach(c=>{h+=`<option value="${c.id}">${esc(c.name)} (+${c.points})</option>`});
      h+=`</select></div><script>document.getElementById("aex-${ki}").onchange=function(){if(this.value){assignToKid(parseInt(this.value),${ki});this.value=""}}<\/script>`}
    h+=`</div>`;
  });
  // Penalties
  h+=`<div class="ss"><h3>⚠️ Penalties (both kids)</h3>`;
  (data.penalties||[]).forEach(p2=>{h+=`<div class="si"><input value="${escA(p2.name)}" onchange="ePN(${p2.id},this.value)"><input type="number" value="${p2.points}" min="0" onchange="ePP(${p2.id},this.value)" inputmode="numeric"><button class="db" onclick="dP(${p2.id})">×</button></div>`});
  h+=`<div class="ar2"><input id="npn" placeholder="New penalty"><input id="npp" type="number" value="10" min="0" inputmode="numeric"><button onclick="aP()">+ Add</button></div></div>`;
  h+=`<div class="ss"><h3>🔗 Sync</h3><div class="cb"><h4>Family Code</h4><code>${esc(familyCode)}</code></div><button class="btn bo" onclick="chFC()">🔄 Change Code</button></div>`;
  h+=`<div class="ss"><h3>🔧 Reset</h3><button class="btn bd" onclick="cfmTR()">🗑️ Total Reset</button></div>`;
  return h;
}

function renderPrompt(){
  return `<div class="prc"><h2>📋 Recreation Prompt</h2><p class="intro">Paste this into any AI assistant to recreate this app.</p>
<h3>Overview</h3><p>Build a colorful chore tracker for 2 kids. Single HTML file + Firebase Realtime Database sync. Per-kid chore assignments, date-based logging, calendar views.</p>
<h3>Layout</h3><ul><li>Kid dashboard tabs with customizable names</li><li>Date picker to log chores for any day</li><li>Mini monthly calendar with color-coded dots on each kid page</li><li>Calendar tab: weekly chore grid + monthly calendar view</li><li>Tap day for detail popup with completed/missed chores</li><li>Per-kid chore assignments (colored initial pills in Settings)</li></ul>
<h3>Features</h3><ul><li>Per-kid chore lists (assign chores to one or both kids)</li><li>Toggle chores per date, cumulative points tracked</li><li>Backfill past dates</li><li>Manual ±point adjustment</li><li>Penalties section</li><li>Weekly grid: chore × day matrix with ✅</li><li>Monthly view: dots + day points + monthly summary stats</li></ul>
<h3>Technical</h3><ul><li>Single HTML, Firebase SDK from CDN</li><li>Per-date choreLog, kidIds array on each chore</li><li>Family code routing, PWA meta tags</li></ul></div>`;
}

/* ══════ ACTIONS ══════ */
function sTab(t){activeTab=t;render();document.getElementById("pages").scrollTop=0}
function chgD(i,d){const n=shD(selDates[i],d);if(n>todayStr())return;selDates[i]=n;render()}
function goT(i){selDates[i]=todayStr();render()}
function opP(i){const p=document.getElementById("dp-"+i);p&&(p.showPicker?p.showPicker():p.click())}
function pkD(i,v){if(!v)return;if(v>todayStr())v=todayStr();selDates[i]=v;render()}
function shMC(ki,d){const mc=mcMonths[ki];mc.month+=d;if(mc.month<0){mc.month=11;mc.year--}if(mc.month>11){mc.month=0;mc.year++}render()}
function mcClick(ki,ds){if(ds>todayStr())return;selDates[ki]=ds;render();document.getElementById("pages").scrollTop=0}
function shW(d){cwStart=shD(cwStart,d*7);render()}
function shCM(d){cMonth.month+=d;if(cMonth.month<0){cMonth.month=11;cMonth.year--}if(cMonth.month>11){cMonth.month=0;cMonth.year++}render()}

function tgC(ki,ds,cid){const k=data.kids[ki],c=(data.chores||[]).find(x=>x.id===cid);if(!c)return;const l=getLog(ki,ds);const idx=l.chores.indexOf(cid);if(idx>-1){l.chores.splice(idx,1);k.score-=c.points}else{l.chores.push(cid);k.score+=c.points}if(!l.chores.length&&!l.penalties.length)delete k.choreLog[ds];save()}
function tgP(ki,ds,pid){const k=data.kids[ki],p2=(data.penalties||[]).find(x=>x.id===pid);if(!p2)return;const l=getLog(ki,ds);const idx=l.penalties.indexOf(pid);if(idx>-1){l.penalties.splice(idx,1);k.score+=p2.points}else{l.penalties.push(pid);k.score-=p2.points}if(!l.chores.length&&!l.penalties.length)delete k.choreLog[ds];save()}
function apAdj(i){const inp=document.getElementById("adj-"+i);const v=parseInt(inp.value,10);if(isNaN(v))return;data.kids[i].score+=v;save()}
function rnKid(i,v){data.kids[i].name=v.trim()||"Kid "+(i+1);save()}
function eCN(id,v){const c=(data.chores||[]).find(x=>x.id===id);if(c){c.name=v.trim()||c.name;save()}}
function eCP(id,v){const c=(data.chores||[]).find(x=>x.id===id);if(c){c.points=Math.max(0,parseInt(v,10)||0);save()}}
function tgKid(choreId,kidIdx){
  const c=(data.chores||[]).find(x=>x.id===choreId);if(!c)return;
  if(!c.kidIds)c.kidIds=[0,1];
  const idx=c.kidIds.indexOf(kidIdx);
  if(idx>-1){if(c.kidIds.length>1)c.kidIds.splice(idx,1)}// Prevent removing both
  else c.kidIds.push(kidIdx);
  c.kidIds.sort();save();
}
function dC(id){data.chores=(data.chores||[]).filter(x=>x.id!==id);data.kids.forEach(k=>{if(k.choreLog)Object.values(k.choreLog).forEach(l=>{if(l.chores)l.chores=l.chores.filter(x=>x!==id)})});save()}
function rmFromKid(choreId,kidIdx){
  const c=(data.chores||[]).find(x=>x.id===choreId);if(!c)return;
  const ids=c.kidIds||[0,1];
  if(ids.length<=1){dC(choreId);return}// Only assigned to this kid — delete entirely
  c.kidIds=ids.filter(x=>x!==kidIdx);save();
}
function aCK(ki){const n=document.getElementById("ncn-"+ki).value.trim(),pts=parseInt(document.getElementById("ncp-"+ki).value,10)||5;if(!n)return;
  if(!data.chores)data.chores=[];data.chores.push({id:data.nextId++,name:n,points:Math.max(0,pts),kidIds:[ki]});save()}
function assignToKid(choreId,kidIdx){
  const c=(data.chores||[]).find(x=>x.id===choreId);if(!c)return;
  if(!c.kidIds)c.kidIds=[0,1];
  if(!c.kidIds.includes(kidIdx)){c.kidIds.push(kidIdx);c.kidIds.sort()}save();
}
function ePN(id,v){const p2=(data.penalties||[]).find(x=>x.id===id);if(p2){p2.name=v.trim()||p2.name;save()}}
function ePP(id,v){const p2=(data.penalties||[]).find(x=>x.id===id);if(p2){p2.points=Math.max(0,parseInt(v,10)||0);save()}}
function dP(id){data.penalties=(data.penalties||[]).filter(x=>x.id!==id);data.kids.forEach(k=>{if(k.choreLog)Object.values(k.choreLog).forEach(l=>{if(l.penalties)l.penalties=l.penalties.filter(x=>x!==id)})});save()}
function aP(){const n=document.getElementById("npn").value.trim(),pts=parseInt(document.getElementById("npp").value,10)||10;if(!n)return;if(!data.penalties)data.penalties=[];data.penalties.push({id:data.nextId++,name:n,points:Math.max(0,pts)});save()}
function chFC(){familyCode="";localStorage.removeItem("choreTracker_familyCode");if(dbRef){dbRef.off();dbRef=null}data=null;renderSetup()}

let ovAct=null;
function showOv(t,m,b,fn){document.getElementById("ovT").textContent=t;document.getElementById("ovM").textContent=m;const btn=document.getElementById("ovC");btn.textContent=b;ovAct=fn;btn.onclick=()=>{closeOv();if(ovAct)ovAct()};document.getElementById("overlay").classList.add("show")}
function closeOv(){document.getElementById("overlay").classList.remove("show");ovAct=null}
function cfmRD(ki,ds){const isT=ds===todayStr();showOv("Reset Day","Undo all switches for "+data.kids[ki].name+" on "+(isT?"today":fmt(ds))+"?","Reset",()=>{const k=data.kids[ki],l=getLog(ki,ds);(l.chores||[]).forEach(cid=>{const c=(data.chores||[]).find(x=>x.id===cid);if(c)k.score-=c.points});(l.penalties||[]).forEach(pid=>{const p2=(data.penalties||[]).find(x=>x.id===pid);if(p2)k.score+=p2.points});delete k.choreLog[ds];save()})}
function cfmTR(){showOv("Total Reset","Erase ALL data?","Yes, Erase",()=>{data=JSON.parse(JSON.stringify(DEFAULT_DATA));activeTab="kid-0";selDates=[todayStr(),todayStr()];save()})}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function escA(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

renderSetup();
</script>
